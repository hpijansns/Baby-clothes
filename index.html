<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px 28px;
      overflow: hidden;
      user-select: none;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .meta-logo {
      height: 14px;
      opacity: 0.65;
    }

    .center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 320px;
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-effect {
      position: absolute;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background-color: rgba(37, 211, 102, 0.25);
      animation: radar 2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }

    .app-icon {
      position: relative;
      width: 76px;
      height: 76px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.35);
    }

    .app-icon svg {
      width: 44px;
      height: 44px;
      fill: #ffffff;
    }

    .title-text {
      font-size: 20px;
      font-weight: 600;
      color: #111b21;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      text-align: center;
    }

    .sub-text {
      font-size: 14px;
      color: #667781;
      text-align: center;
      margin-bottom: 28px;
    }

    .chat-btn {
      width: 100%;
      height: 48px;
      background-color: #00a884;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 168, 132, 0.3);
      outline: none;
      animation: btnBreathe 1.8s ease-in-out infinite;
      transition: transform 0.1s ease, background-color 0.1s ease;
    }

    .chat-btn:active {
      transform: scale(0.96);
      background-color: #008f6f;
    }

    .tap-hand {
      font-size: 18px;
      animation: fingerTap 1.2s ease-in-out infinite;
    }

    .footer-note {
      font-size: 12px;
      color: #8696a0;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    @keyframes radar {
      0% {
        transform: scale(0.9);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.45);
        opacity: 0;
      }
    }

    @keyframes btnBreathe {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.02);
      }
    }

    @keyframes fingerTap {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <svg class="meta-logo" viewBox="0 0 100 20" fill="#8696a0" xmlns="http://www.w3.org/2000/svg">
      <path d="M5.4 14.8c-2.4 0-4.4-1.9-4.4-4.8 0-2.8 2-4.8 4.4-4.8 1.9 0 3.2 1.1 3.7 2.4l-1.8.8c-.3-.7-1-1.3-1.9-1.3-1.3 0-2.3 1.2-2.3 2.9 0 1.7 1 2.9 2.3 2.9.9 0 1.6-.6 1.9-1.3l1.8.8c-.5 1.3-1.8 2.4-3.7 2.4zm11-9.4h2v9.2h-2V5.4zm10.7 9.2v-1.3c-.6.9-1.6 1.5-2.8 1.5-2.1 0-3.8-1.7-3.8-4.7 0-3 1.7-4.7 3.8-4.7 1.2 0 2.2.6 2.8 1.5V5.4h2v9.2h-2zm-2.7-1.8c1.3 0 2.3-1.1 2.3-2.9 0-1.7-1-2.9-2.3-2.9-1.3 0-2.3 1.2-2.3 2.9 0 1.7 1 2.9 2.3 2.9zm10.3 2v-6.9h-1.4v-1.7h1.4V5l2-.6v2.3h2v1.7h-2v6.4h-2z"/>
    </svg>
  </div>

  <div class="center-content">
    <div class="avatar-wrapper">
      <div class="pulse-effect"></div>
      <div class="app-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.03 14.69 2 12.04 2ZM12.05 3.67C14.25 3.67 16.31 4.53 17.87 6.09C19.42 7.65 20.28 9.72 20.28 11.92C20.28 16.46 16.58 20.15 12.04 20.15C10.56 20.15 9.11 19.76 7.85 19.01L7.55 18.83L4.43 19.65L5.26 16.61L5.06 16.29C4.24 14.99 3.8 13.47 3.8 11.91C3.81 7.37 7.5 3.67 12.05 3.67ZM8.53 7.33C8.37 7.33 8.1 7.39 7.87 7.64C7.65 7.89 7.02 8.48 7.02 9.69C7.02 10.9 7.9 12.07 8.02 12.23C8.15 12.4 9.73 14.82 12.16 15.87C12.74 16.12 13.19 16.27 13.55 16.38C14.13 16.57 14.67 16.54 15.08 16.48C15.55 16.41 16.51 15.9 16.71 15.33C16.92 14.76 16.92 14.27 16.85 14.17C16.79 14.07 16.63 14.01 16.38 13.88C16.14 13.76 14.93 13.17 14.71 13.09C14.48 13.01 14.32 12.97 14.15 13.22C13.99 13.47 13.52 14.01 13.38 14.17C13.24 14.34 13.1 14.36 12.85 14.23C12.61 14.11 11.82 13.85 10.89 13.02C10.16 12.37 9.68 11.57 9.53 11.32C9.39 11.08 9.52 10.94 9.64 10.82C9.75 10.71 9.89 10.53 10.02 10.39C10.14 10.24 10.18 10.14 10.26 9.97C10.35 9.81 10.3 9.66 10.24 9.54C10.18 9.42 9.71 8.26 9.51 7.78C9.32 7.31 9.12 7.37 8.97 7.36C8.83 7.35 8.67 7.33 8.53 7.33Z"/>
        </svg>
      </div>
    </div>

    <div class="title-text">Continue to Chat</div>
    <div class="sub-text">Connecting you directly to WhatsApp</div>

    <button id="openBtn" class="chat-btn">
      <span>Continue to Chat</span>
      <span class="tap-hand">👆</span>
    </button>
  </div>

  <div class="footer-note">from Meta</div>

  <script>
    const messages = [
      "Hello, I would like to get complete details about the handwriting work.",
      "Hello, could you please provide information regarding the copy writing work?",
      "Hello, I am interested in the handwritten copy work. Please share the details.",
      "Hello, I would like to know the process for writing from a sample copy to a blank copy.",
      "Hello, could you please share details regarding the handwriting tasks and payment structure?",
      "Hello, I am writing to enquire about the available copy writing assignments.",
      "Hello, please provide information on how the blank copy writing work functions.",
      "Hello, I would like to check the available tasks for handwritten work.",
      "Hello, could you please explain the work quantity and payout procedure?",
      "Hello, I am looking for complete information regarding the handwriting project.",
      "Hello, could you guide me on how to get started with the copy writing work?",
      "Hello, I would like to know more about the handwritten copy assignments.",
      "Hello, please share the guidelines for copying content from filled pages to blank pages.",
      "Hello, could you explain the complete workflow for handwriting-based tasks?",
      "Hello, I am interested in knowing the current availability of copy writing work.",
      "Hello, could you please guide me through the onboarding process for handwriting work?",
      "Hello, how can I receive the blank copy writing assignments? Please share details.",
      "Hello, I would like to know about the daily task requirements and guidelines.",
      "Hello, could you please provide a sample copy format and work instructions?",
      "Hello, I am enquiring about the home-based copy writing work opportunities.",
      "Hello, please share the rules, submission guidelines, and payment cycles for handwriting work.",
      "Hello, could you provide details regarding assignment quantities and per-page specifics?",
      "Hello, what is the procedure to begin handwriting tasks? Kindly share details.",
      "Hello, are there any copy writing tasks currently open? Please share the requirements.",
      "Hello, I would like to receive the guidelines and specifications for writing tasks.",
      "Hello, could you explain the system for handwritten page submissions?",
      "Hello, I would like to get details on the writing format and completion timeframes.",
      "Hello, could you please send the complete details for the copy filling assignment?",
      "Hello, I am interested in understanding the work requirements and terms for handwriting tasks.",
      "Hello, please provide an overview of the copy writing process and initial assignment details.",
      "Hello, could you please provide full details on how the copy writing work is assigned?",
      "Hello, I would appreciate receiving complete information regarding handwritten copy work."
    ];

    const phoneNumber = "919982420040";
    const btn = document.getElementById("openBtn");

    btn.addEventListener("click", function(e) {
      e.preventDefault();

      const now = new Date();
      const currentSeconds = now.getSeconds();
      const selectedIndex = currentSeconds % messages.length;
      const selectedMsg = messages[selectedIndex];

      const encodedMsg = encodeURIComponent(selectedMsg);

      const nativeUrl = "whatsapp://send?phone=" + phoneNumber + "&text=" + encodedMsg;
      const webFallback = "https://api.whatsapp.com/send?phone=" + phoneNumber + "&text=" + encodedMsg;

      window.location.href = nativeUrl;

      setTimeout(function() {
        window.location.href = webFallback;
      }, 400);
    });
  </script>

</body>
</html>
