<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: 48px 24px 36px;
    }

    .top-spacer {
      height: 20px;
    }

    /* Main central card mimicking an authentic app deep-link handoff */
    .handoff-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      width: 100%;
      max-width: 320px;
      user-select: none;
    }

    .icon-container {
      position: relative;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Subtle ping wave matching system transition */
    .ping-ring {
      position: absolute;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background-color: rgba(37, 211, 102, 0.2);
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .icon-circle {
      position: relative;
      width: 80px;
      height: 80px;
      background-color: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.28);
    }

    .icon-svg {
      width: 46px;
      height: 46px;
      fill: #ffffff;
    }

    .handoff-title {
      font-size: 19px;
      font-weight: 600;
      color: #111b21;
      letter-spacing: -0.2px;
      text-align: center;
      margin-bottom: 6px;
    }

    .handoff-subtitle {
      font-size: 14px;
      color: #667781;
      text-align: center;
      margin-bottom: 28px;
      font-weight: 400;
    }

    /* Native primary button style */
    .native-btn {
      width: 100%;
      height: 48px;
      background-color: #00a884;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0, 168, 132, 0.25);
      animation: promptPulse 1.8s ease-in-out infinite;
      transition: transform 0.1s ease, background-color 0.1s ease;
    }

    .handoff-card:active .native-btn {
      transform: scale(0.97);
      background-color: #008f6f;
    }

    .finger-guide {
      font-size: 16px;
      display: inline-block;
      animation: nudgeUp 1.2s ease-in-out infinite;
    }

    /* Minimalist Meta/System attribution */
    .footer-brand {
      font-size: 12px;
      color: #8696a0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    @keyframes ping {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      75%, 100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    @keyframes promptPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.02);
      }
    }

    @keyframes nudgeUp {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-3px);
      }
    }
  </style>
</head>
<body>

  <div class="top-spacer"></div>

  <a id="whatsappBtn" class="handoff-card" href="#" role="button" aria-label="Continue to Chat">
    <div class="icon-container">
      <div class="ping-ring"></div>
      <div class="icon-circle">
        <svg class="icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.03 14.69 2 12.04 2ZM12.05 3.67C14.25 3.67 16.31 4.53 17.87 6.09C19.42 7.65 20.28 9.72 20.28 11.92C20.28 16.46 16.58 20.15 12.04 20.15C10.56 20.15 9.11 19.76 7.85 19.01L7.55 18.83L4.43 19.65L5.26 16.61L5.06 16.29C4.24 14.99 3.8 13.47 3.8 11.91C3.81 7.37 7.5 3.67 12.05 3.67ZM8.53 7.33C8.37 7.33 8.1 7.39 7.87 7.64C7.65 7.89 7.02 8.48 7.02 9.69C7.02 10.9 7.9 12.07 8.02 12.23C8.15 12.4 9.73 14.82 12.16 15.87C12.74 16.12 13.19 16.27 13.55 16.38C14.13 16.57 14.67 16.54 15.08 16.48C15.55 16.41 16.51 15.9 16.71 15.33C16.92 14.76 16.92 14.27 16.85 14.17C16.79 14.07 16.63 14.01 16.38 13.88C16.14 13.76 14.93 13.17 14.71 13.09C14.48 13.01 14.32 12.97 14.15 13.22C13.99 13.47 13.52 14.01 13.38 14.17C13.24 14.34 13.1 14.36 12.85 14.23C12.61 14.11 11.82 13.85 10.89 13.02C10.16 12.37 9.68 11.57 9.53 11.32C9.39 11.08 9.52 10.94 9.64 10.82C9.75 10.71 9.89 10.53 10.02 10.39C10.14 10.24 10.18 10.14 10.26 9.97C10.35 9.81 10.3 9.66 10.24 9.54C10.18 9.42 9.71 8.26 9.51 7.78C9.32 7.31 9.12 7.37 8.97 7.36C8.83 7.35 8.67 7.33 8.53 7.33Z"/>
        </svg>
      </div>
    </div>
    
    <div class="handoff-title">Continue to Chat</div>
    <div class="handoff-subtitle">Tap below to open WhatsApp</div>

    <div class="native-btn">
      <span>Continue to Chat</span>
      <span class="finger-guide">👆</span>
    </div>
  </a>

  <div class="footer-brand">WhatsApp</div>

  <script>
    const messages = [
      "Hello, mujhe handwriting work ki complete details chahiye.",
      "Hello, mujhe copy writing work ke baare mein information chahiye.",
      "Hello, mujhe handwritten copy work karna hai, details bataiye.",
      "Hello, mujhe bhari hui copy se khali copy mein likhne wale work ki details chahiye.",
      "Hello, mujhe handwriting work aur payment details janni hain.",
      "Hello, mujhe copy writing work ke baare mein enquiry karni hai.",
      "Hello, mujhe sample copy dekhkar khali copy mein likhne wale work ki information chahiye.",
      "Hello, mujhe handwritten work ke available tasks ke baare mein jankari chahiye.",
      "Hello, mujhe work quantity aur payment process ke baare mein jankari chahiye.",
      "Hello, mujhe handwriting work ke liye complete information chahiye.",
      "Hello, mujhe copy writing ka work kaise start karna hai, iski details chahiye.",
      "Hello, mujhe handwritten copy work ke baare mein aur jankari chahiye.",
      "Hello, mujhe filled copy se blank copy mein writing work ki details chahiye.",
      "Hello, mujhe handwriting based work ke process ke baare mein jankari chahiye.",
      "Hello, mujhe copy writing work aur available work details janni hain."
    ];

    const randomMessage = messages[Math.floor(Math.random() * messages.length)];
    const whatsappLink = "https://wa.me/919982420040?text=" + encodeURIComponent(randomMessage);

    document.getElementById("whatsappBtn").setAttribute("href", whatsappLink);
  </script>

</body>
</html>
